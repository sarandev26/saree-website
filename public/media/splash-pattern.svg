<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160" fill="none">
  <!-- Paisley / Peacock Motif 1 -->
  <g transform="translate(40, 40) rotate(15)">
    <path d="M0 40 C -25 35 -35 15 -25 -5 C -15 -25 15 -35 25 -15 C 32 0 20 20 5 28 C -5 34 -3 38 0 40 Z" fill="#0E6B6B" fill-opacity="0.25" stroke="#E8A317" stroke-width="1.2"/>
    <path d="M0 32 C -18 28 -25 12 -18 -2 C -10 -16 10 -22 18 -10 C 22 2 12 16 2 22 Z" fill="#062C30" fill-opacity="0.3" stroke="#F6C65B" stroke-width="0.8"/>
    <circle cx="0" cy="5" r="5" fill="#E8A317" fill-opacity="0.6"/>
    <circle cx="0" cy="5" r="2.5" fill="#062C30"/>
    <!-- Feather rays -->
    <path d="M-15 -2 C -24 -6 -28 -14 -25 -20" stroke="#E8A317" stroke-width="0.8" stroke-linecap="round"/>
    <path d="M-10 -15 C -16 -24 -14 -30 -8 -34" stroke="#E8A317" stroke-width="0.8" stroke-linecap="round"/>
    <path d="M5 -18 C 10 -26 18 -28 24 -24" stroke="#E8A317" stroke-width="0.8" stroke-linecap="round"/>
    <path d="M15 -8 C 24 -12 30 -8 32 -2" stroke="#E8A317" stroke-width="0.8" stroke-linecap="round"/>
  </g>

  <!-- Repeat Offset Motif 2 -->
  <g transform="translate(120, 120) rotate(-165)">
    <path d="M0 40 C -25 35 -35 15 -25 -5 C -15 -25 15 -35 25 -15 C 32 0 20 20 5 28 C -5 34 -3 38 0 40 Z" fill="#0E6B6B" fill-opacity="0.25" stroke="#E8A317" stroke-width="1.2"/>
    <path d="M0 32 C -18 28 -25 12 -18 -2 C -10 -16 10 -22 18 -10 C 22 2 12 16 2 22 Z" fill="#062C30" fill-opacity="0.3" stroke="#F6C65B" stroke-width="0.8"/>
    <circle cx="0" cy="5" r="5" fill="#E8A317" fill-opacity="0.6"/>
    <circle cx="0" cy="5" r="2.5" fill="#062C30"/>
  </g>

  <!-- Small corner botanical florets -->
  <g transform="translate(120, 30)">
    <circle cx="0" cy="0" r="3" fill="#E8A317" fill-opacity="0.5"/>
    <circle cx="-6" cy="0" r="2" fill="#0E6B6B" fill-opacity="0.4"/>
    <circle cx="6" cy="0" r="2" fill="#0E6B6B" fill-opacity="0.4"/>
    <circle cx="0" cy="-6" r="2" fill="#0E6B6B" fill-opacity="0.4"/>
    <circle cx="0" cy="6" r="2" fill="#0E6B6B" fill-opacity="0.4"/>
  </g>
  <g transform="translate(30, 130)">
    <circle cx="0" cy="0" r="3" fill="#E8A317" fill-opacity="0.5"/>
    <circle cx="-6" cy="0" r="2" fill="#0E6B6B" fill-opacity="0.4"/>
    <circle cx="6" cy="0" r="2" fill="#0E6B6B" fill-opacity="0.4"/>
    <circle cx="0" cy="-6" r="2" fill="#0E6B6B" fill-opacity="0.4"/>
    <circle cx="0" cy="6" r="2" fill="#0E6B6B" fill-opacity="0.4"/>
  </g>
</svg>

